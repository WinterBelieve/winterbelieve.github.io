<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Document viewer for publications and thesis files.">
  <title>Daniel Yuan | Document Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="viewer-page" data-lang="zh" data-page="publications">
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="site-header">
    <a href="index.html" class="brand" aria-label="Back to home">DY</a>
    <nav class="nav">
      <a id="nav-about" href="index.html"></a>
      <a id="nav-education" href="education.html"></a>
      <a id="nav-experience" href="experience.html"></a>
      <a id="nav-publications" href="publications.html"></a>
      <a id="nav-teaching" href="teaching.html"></a>
      <a id="nav-activities" href="activities.html"></a>
      <a id="nav-contact" href="contact.html"></a>
    </nav>
    <div class="header-controls">
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="切換至夜間模式" title="切換至夜間模式">
        <span class="theme-icon" aria-hidden="true">☾</span>
      </button>
      <div class="lang-switch" role="group" aria-label="Language Switcher">
        <button class="lang-toggle" data-set-lang="zh" type="button">中文</button>
        <button class="lang-toggle" data-set-lang="en" type="button">EN</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="section-head reveal">
        <p id="viewer-tag" class="tag">Document Viewer</p>
        <h2 id="viewer-title"></h2>
      </div>
      <p id="viewer-meta" class="section-copy reveal"></p>

      <div class="doc-shell reveal">
        <div id="pdf-stage" class="pdf-stage" aria-live="polite">
          <p id="pdf-loading" class="pdf-loading">Loading document...</p>
          <canvas id="pdf-canvas" class="pdf-canvas" hidden></canvas>
          <p id="pdf-error" class="pdf-error" hidden></p>
        </div>
      </div>

      <div id="pdf-controls" class="pdf-controls reveal" aria-label="Document pagination">
        <button id="pdf-prev" class="btn btn-secondary pdf-nav-btn" type="button">Previous</button>
        <span id="pdf-page-indicator" class="pdf-page-indicator"></span>
        <button id="pdf-next" class="btn btn-secondary pdf-nav-btn" type="button">Next</button>
      </div>

      <div class="viewer-actions reveal">
        <a id="viewer-back" class="btn btn-primary" href="publications.html">Back to Publications</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
